<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dayflow — Minimalist Daily Planner</title>
    <meta
      name="description"
      content="Minimalist daily planner for chronological time-blocking, deep work focus, and intentional routines."
    />
    <meta property="og:title" content="Dayflow — Minimalist Daily Planner" />
    <meta
      property="og:description"
      content="Minimalist daily planner for chronological time-blocking, deep work focus, and intentional routines."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#FAFAFA] text-[#09090B] dark:bg-[#09090B] dark:text-[#FAFAFA] antialiased selection:bg-[#4648d4]/15 selection:text-[#4648d4] dark:selection:bg-[#6366F1]/25 dark:selection:text-[#A5B4FC]">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dayflow_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
